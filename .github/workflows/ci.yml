name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jjk-messenger/backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jjk_messenger_ci
      JWT_SECRET: ci-jwt-secret-not-for-production
      FRONTEND_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      TRUST_PROXY_HOPS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jjk-messenger/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint and typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify refresh rotation
        run: npm run test:refresh-rotation

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jjk-messenger/frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3002
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jjk-messenger/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  scribe:
    name: SCRIBE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SCRIBE tests
        run: python -m unittest discover -s .agent/workflow/scribe/sel/tests

      - name: Run SCRIBE-RAG tests
        run: python -m unittest discover -s .agent/workflow/scribe/rag/tests

      - name: Run SCRIBE-RAG eval
        run: .agent/workflow/scribe/scribe-rag eval --force

      - name: Run SCRIBE doctor
        run: .agent/workflow/scribe/scribe doctor --suggest-fix

      - name: Build SCRIBE bundle graph
        run: .agent/workflow/scribe/scribe graph --build
